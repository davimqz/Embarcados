; Projeto isolado só para testar a montagem física (não é o firmware do silo).
; Uso: cd firmware/teste-montagem && pio run -t upload && pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
